name: Daily Stock Scan

on:
  schedule:
    - cron: "30 22 * * 0-4"   # 06:30 台灣（UTC 前一日 22:30）；GitHub 排程常延遲數小時，提早以趕上早盤
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Asia/Taipei

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set date key
        run: echo "TODAY=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Restore price data cache
        uses: actions/cache/restore@v4
        with:
          path: data_cache/
          key: tw-price-cache-${{ env.TODAY }}-${{ github.run_id }}
          restore-keys: |
            tw-price-cache-

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install --upgrade setuptools && pip install -r requirements.txt

      - name: Run scan
        timeout-minutes: 30
        run: |
          python -u -c "import faulthandler,runpy; faulthandler.dump_traceback_later(600, repeat=True); runpy.run_path('scanner.py', run_name='__main__')"

      - name: Save price data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data_cache/
          key: tw-price-cache-${{ env.TODAY }}-${{ github.run_id }}

      - name: Send daily email
        if: always()
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python email_notifier.py

      - name: Notify failure
        if: failure()
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          payload=$(jq -n --arg to "$LINE_USER_ID" \
            --arg text $'⚠️ 今日股票掃描失敗\n請至 GitHub Actions 查看錯誤：\nhttps://github.com/0911207240/stock-dashboard/actions' \
            '{to: $to, messages: [{type: "text", text: $text}]}')
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -d "$payload"

      - name: Save state files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in revenue_cache.json push_cooldown.json daytrade_history.json signal_history.json scoring_weights.json tdcc_cache.json morning_lock.json market_log.json scan_results.json fundamental_cache.json news_sentiment_cache.json earnings_cache.json dividend_cache.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          git pull --rebase origin main || echo "::warning::git pull --rebase 失敗"
          git push || echo "::warning::狀態檔推送失敗，本次狀態未保存"
