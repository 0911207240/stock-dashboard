name: Health Check

on:
  schedule:
    - cron: "30 2 * * 1-5"   # 10:30 台灣（UTC 02:30）；檢查各排程並在必要時補跑台股掃描
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  health:
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: echo "stdlib only"

      - name: Run health check
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python -u health_check.py

      - name: Save ops log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f ops_log.json ] && git add ops_log.json
          git diff --cached --quiet || git commit -m "chore: update ops log [skip ci]"
          git pull --rebase origin main || echo "::warning::git pull --rebase 失敗"
          git push || echo "::warning::營運紀錄推送失敗"
