name: FX Daily

on:
  schedule:
    - cron: "0 21 * * *"   # 05:00 台灣時間；雲端 routine「每日匯率監控」09:00 讀 fx_daily.json，預留 GitHub 排程延遲
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fx:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Asia/Taipei

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance==1.7.0 pandas

      - name: Fetch FX rates
        run: python fx_daily.py

      - name: Save fx_daily.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fx_daily.json
          git diff --cached --quiet || git commit -m "chore: update fx_daily [skip ci]"
          git pull --rebase origin main || echo "::warning::git pull --rebase 失敗"
          git push || echo "::warning::fx_daily.json 推送失敗"
